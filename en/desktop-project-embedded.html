<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Projects</title>

<base href="/">
<script>
/* GitHub Pages English entry point: load the single canonical portfolio source. */
(async function(){
 try {
  const response=await fetch('/desktop-project-embedded.html',{cache:'no-cache'});
  if(!response.ok)throw new Error('Unable to load portfolio ('+response.status+')');
  let html=await response.text();
  html=html.replace(/<html([^>]*)lang=["']fr["']/i,'<html$1lang="en"');
  html=html.replace(/<head([^>]*)>/i,'<head$1><base href="/">');
  
  html=html.replace(/<\\/head>/i,'<script src="/en/i18n.js"><\\/script><\\/head>');
  document.open();document.write(html);document.close();
 } catch(error){document.body.textContent='Portfolio could not be loaded. Please refresh this page.';console.error(error)}
})();
</script>
</head><body></body></html>
