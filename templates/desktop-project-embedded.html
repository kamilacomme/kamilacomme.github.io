<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Portfolio – Desktop scroll preview</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,700;1,400&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="/styles/layered-ticket.css" rel="stylesheet"/><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:0;background:#fff;color:#222022;font-family:Inter,Arial,sans-serif}.portfolio{position:relative;background:#fff}.sticky{height:100svh;position:sticky;top:0;overflow:hidden}.stage{position:absolute;left:0;top:0;width:100vw;height:100svh;transform:none}.heading{position:absolute;left:32px;top:117px;width:760px;font:700 56px/1 Figtree,Arial,sans-serif;letter-spacing:-1.68px;margin:0}.heading em{font-weight:400}.toolbar{position:absolute;right:32px;top:216px;display:flex;gap:20px;align-items:center}.toolbar small{font-size:12px;font-weight:400;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:#777}.toolbar button{background:white;border:1px solid #ddd;border-radius:50%;width:36px;height:36px;cursor:pointer}.toolbar button:hover{background:#eee}.rail{display:flex;gap:25px;position:absolute;left:32px;top:387.547px;width:max-content;overflow:visible;will-change:transform}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}.next-section{min-height:100svh;background:#08080a;color:white;display:flex;align-items:center;justify-content:center;font:700 clamp(36px,5vw,72px)/1 Figtree,Arial,sans-serif}.next-section span{opacity:.75}</style></head><body><main class="portfolio" id="portfolio"><div class="sticky"><div class="stage" id="stage"><h1 class="heading">Une sélection des <em>projets</em><br/>les plus récents.</h1><div class="toolbar"><small>Explorer →</small></div><div aria-label="Six projets, progression horizontale par le défilement vertical" class="rail" id="rail">{{desktopCards}}</div></div></div></main><section aria-label="Section suivante" class="next-section"><span>Section suivante ↓</span></section><script>
(()=>{
 const standalone=document.getElementById('portfolio'),stage=document.getElementById('stage'),rail=document.getElementById('rail');
 const embed=window.parent!==window;
 let outer=null;
 if(embed){try{outer=window.parent.document.getElementById('projets')}catch(e){outer=null}}
 const section=outer||standalone;
 const scrollWindow=outer?window.parent:window;
 let maxTravel=0,scrollable=0,start=0,scheduled=false,introHold=0,introShift=0;
 const margin=32,designTicketWidth=1142;
 function measure(){
   const host=outer?scrollWindow:window;
   const vw=host.innerWidth,vh=host.innerHeight;
   // The iframe owns desktop Projects geometry; keep its text-bearing stage unscaled.
   stage.style.width=`${vw}px`;
   stage.style.height=`${vh}px`;
   // Align to the established Hero content edge while keeping all ticket sizes in CSS pixels.
   let targetLeft=32;
   if(outer){
     const hero=scrollWindow.document.querySelector('h1');
     if(hero){
       const actual=hero.getBoundingClientRect().left;
       if(Number.isFinite(actual))targetLeft=actual;
     }
   }
   const stageLeft=targetLeft-margin;
   stage.style.left=`${stageLeft}px`;
   stage.querySelector('.heading').style.left='32px';
   rail.style.left='32px';
   const rightInset=targetLeft+16;
   const toolbar=stage.querySelector('.toolbar');
   toolbar.style.right=`${stageLeft+rightInset}px`;
   // Keep the 1142px design ticket at desktop size; below that, fit the card to
   // the actual space between its established left edge and right-side Explorer inset.
   const ticketWidth=Math.min(designTicketWidth,Math.max(0,vw-targetLeft-rightInset));
   stage.style.setProperty('--kc-desktop-ticket-width',`${ticketWidth}px`);
   const firstTicket=rail.querySelector('.ticket');
   const cardHeight=firstTicket?firstTicket.getBoundingClientRect().height:393.453;
   const heading=stage.querySelector('.heading');
   // On short landscape screens, the bottom-anchored ticket can rise into the
   // two-line heading. Reserve a clear reading gap, then use the existing intro
   // scroll interval to move the heading and rail upward together until the full
   // ticket fits. This keeps the authored ticket dimensions and rail controller.
   const headingBottom=(heading?heading.offsetTop+heading.offsetHeight:0);
   const safeRailTop=headingBottom+24;
   const bottomRailTop=vh-targetLeft-cardHeight;
   rail.style.top=`${Math.max(bottomRailTop,safeRailTop)}px`;
   introShift=Math.max(0,safeRailTop-bottomRailTop);
   // Read the responsive rail after the CSS card width has resolved, then allocate
   // exactly its remaining physical travel to the parent section's vertical scroll span.
   // scrollWidth is integer-rounded and can leave a fractional final gap when
   // responsive card widths are fractional CSS pixels.
   const railWidth=rail.getBoundingClientRect().width;
   const railEnd=stageLeft+rail.offsetLeft+railWidth;
   // Keep the established card/toolbar sizing inset, but end the rail at the
   // shared page gutter used by the navbar's Hire control.
   maxTravel=Math.max(0,railEnd-(vw-targetLeft));
   scrollable=maxTravel;
   introHold=Math.max(introShift,Math.min(120,Math.round(vh*0.14)));
   section.style.height=`${vh+introHold+scrollable}px`;
   if(outer)standalone.style.height=`${vh}px`;
   start=section.getBoundingClientRect().top+scrollWindow.scrollY;
   update();
 }
 function update(){
   scheduled=false;
   const sectionProgress=Math.max(0,scrollWindow.scrollY-start);
   const introProgress=introHold?Math.min(1,sectionProgress/introHold):1;
   const verticalShift=introShift*introProgress;
   const progress=Math.max(0,Math.min(scrollable,sectionProgress-introHold));
   stage.querySelector('.heading').style.transform=`translate3d(0,${-verticalShift}px,0)`;
   rail.style.transform=`translate3d(${-progress}px,${-verticalShift}px,0)`;
 }
 function onScroll(){if(!scheduled){scheduled=true;requestAnimationFrame(update)}}
 scrollWindow.addEventListener('scroll',onScroll,{passive:true});
 (outer?scrollWindow:window).addEventListener('resize',measure);
 window.addEventListener('load',measure,{once:true});
 document.fonts?.ready.then(measure);measure();
})();
</script><script>(()=>{
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  const interval=1900; // Same slideshow speed on Tour de parole, Celimax and Napoli.
  document.querySelectorAll('.ticket').forEach(ticket=>{
    const layers=[...ticket.querySelectorAll('.ticket-image .media-layer')];
    const video=layers.find(el=>el.tagName==='VIDEO');
    const poster=layers[0];
    let timer=null,index=0,hovering=false;
    function display(i){
      index=i;
      layers.forEach((el,j)=>el.classList.toggle('active',j===index));
    }
    function start(){
      if(hovering||reduced.matches)return;
      hovering=true;
      if(video){
        if(!video.getAttribute('src') && video.dataset.src){video.src=video.dataset.src;video.load();}
        // Retain poster image until video can actually render.
        const play=()=>{if(!hovering)return;display(layers.indexOf(video));video.play().catch(()=>display(0));};
        if(video.readyState>=2)play();else video.addEventListener('loadeddata',play,{once:true});
      }else if(layers.length>1){
        display(1);
        timer=setInterval(()=>display((index+1)%layers.length),interval);
      }
    }
    function stop(){
      hovering=false;
      if(timer!==null){clearInterval(timer);timer=null;}
      if(video){video.pause();video.currentTime=0;}
      display(0);
    }
    ticket.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')start()});
    ticket.addEventListener('pointerleave',stop);
    ticket.addEventListener('focusin',start);
    ticket.addEventListener('focusout',e=>{if(!ticket.contains(e.relatedTarget))stop()});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
  });
})();</script></body></html>
