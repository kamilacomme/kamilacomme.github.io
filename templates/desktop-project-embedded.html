<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Portfolio – Desktop scroll preview</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,700;1,400&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="/styles/layered-ticket.css" rel="stylesheet"/><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:0;background:#fff;color:#222022;font-family:Inter,Arial,sans-serif}.portfolio{position:relative;background:#fff}.sticky{height:100svh;position:sticky;top:0;overflow:hidden}.stage{position:absolute;left:0;top:0;width:1440px;height:813px;transform-origin:top left}.heading{position:absolute;left:32px;top:117px;width:760px;font:700 56px/1 Figtree,Arial,sans-serif;letter-spacing:-1.68px;margin:0}.heading em{font-weight:400}.toolbar{position:absolute;right:32px;top:216px;display:flex;gap:20px;align-items:center}.toolbar small{font-size:12px;font-weight:400;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:#777}.toolbar button{background:white;border:1px solid #ddd;border-radius:50%;width:36px;height:36px;cursor:pointer}.toolbar button:hover{background:#eee}.rail{display:flex;gap:25px;position:absolute;left:32px;top:387.547px;width:max-content;overflow:visible;will-change:transform}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}.next-section{min-height:100svh;background:#08080a;color:white;display:flex;align-items:center;justify-content:center;font:700 clamp(36px,5vw,72px)/1 Figtree,Arial,sans-serif}.next-section span{opacity:.75}</style></head><body><main class="portfolio" id="portfolio"><div class="sticky"><div class="stage" id="stage"><h1 class="heading">Une sélection des <em>projets</em><br/>les plus récents.</h1><div class="toolbar"><small>Explorer →</small></div><div aria-label="Six projets, progression horizontale par le défilement vertical" class="rail" id="rail">{{desktopCards}}</div></div></div></main><section aria-label="Section suivante" class="next-section"><span>Section suivante ↓</span></section><script>
(()=>{
 const standalone=document.getElementById('portfolio'),stage=document.getElementById('stage'),rail=document.getElementById('rail');
 const embed=window.parent!==window;
 let outer=null;
 if(embed){try{outer=window.parent.document.getElementById('projets')}catch(e){outer=null}}
 const section=outer||standalone;
 const scrollWindow=outer?window.parent:window;
 let maxTravel=0,scrollable=0,start=0,scale=1,scheduled=false,introHold=0;
 const frameWidth=1440,margin=32;
 function measure(){
   const host=outer?scrollWindow:window;
   const vw=host.innerWidth,vh=host.innerHeight;
   // Same scale as the main site's desktop Hero and About.
   const fw=vw/frameWidth,fh=vh/844;
   scale=Math.min(fw,Math.min(1.08,Math.max(0.72,Math.min(fw,fh))));
   stage.style.transform=`scale(${scale})`;
   stage.style.height=`${vh/scale}px`;
   // Match the centered 1440px reference frame used by the other blocks.
   const offset=(vw-frameWidth*scale)/2;
   // Read the actual Hero headline position in the parent page. Its rendered
   // position is the grid reference; an arithmetic 1440-frame estimate alone
   // can disagree with the host's responsive layout.
   let targetLeft=offset+32*scale;
   if(outer){
     const hero=scrollWindow.document.querySelector('h1');
     if(hero){
       const actual=hero.getBoundingClientRect().left;
       if(Number.isFinite(actual))targetLeft=actual;
     }
   }
   const stageLeft=targetLeft-margin*scale;
   stage.style.left=`${stageLeft}px`;
   stage.querySelector('.heading').style.left='32px';
   rail.style.left='32px';
   // Adjust only the right edge, using the same stage coordinates as before.
   const toolbar=stage.querySelector('.toolbar');
   const rightInset=targetLeft+16;
   toolbar.style.right=`${(stageLeft+frameWidth*scale-(vw-rightInset))/scale}px`;
   // Keep all text in the stage on the same scale, without overrides.
   stage.querySelector('.heading').style.removeProperty('font-size');
   stage.querySelector('.toolbar small').style.removeProperty('font-size');
   // Bottom edge matches the same physical margin as the measured Hero left edge.
   rail.style.top=`${(vh-targetLeft)/scale-393.453}px`;
   // Keep the previously working rail-scroll calculation, with the same
   // small right inset as Explorer.
   const railWidth=rail.scrollWidth;
   const railEnd=stageLeft+(rail.offsetLeft+railWidth)*scale;
   maxTravel=Math.max(0,(railEnd-(vw-rightInset))/scale);
   scrollable=maxTravel*scale;
   // A short vertical-scroll hold lets the first Pilates ticket settle
   // before the horizontal journey starts.
   introHold=Math.min(120,Math.round(vh*0.14));
   section.style.height=`${vh+introHold+scrollable}px`;
   if(outer)standalone.style.height=`${vh}px`;
   start=section.getBoundingClientRect().top+scrollWindow.scrollY;
   update();
 }
 function update(){scheduled=false;let progress=Math.max(0,Math.min(scrollable,scrollWindow.scrollY-start-introHold));rail.style.transform=`translate3d(${-progress/scale}px,0,0)`}
 function onScroll(){if(!scheduled){scheduled=true;requestAnimationFrame(update)}}
 scrollWindow.addEventListener('scroll',onScroll,{passive:true});
 window.addEventListener('resize',measure);
 if(outer)scrollWindow.addEventListener('resize',measure);
 window.addEventListener('load',measure,{once:true});
 document.fonts?.ready.then(measure);measure();
})();
</script><script>(()=>{
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  const interval=1900; // Same slideshow speed on Tour de parole, Celimax and Napoli.
  document.querySelectorAll('.ticket').forEach(ticket=>{
    const layers=[...ticket.querySelectorAll('.ticket-image .media-layer')];
    const video=layers.find(el=>el.tagName==='VIDEO');
    const poster=layers[0];
    let timer=null,index=0,hovering=false;
    function display(i){
      index=i;
      layers.forEach((el,j)=>el.classList.toggle('active',j===index));
    }
    function start(){
      if(hovering||reduced.matches)return;
      hovering=true;
      if(video){
        if(!video.getAttribute('src') && video.dataset.src){video.src=video.dataset.src;video.load();}
        // Retain poster image until video can actually render.
        const play=()=>{if(!hovering)return;display(layers.indexOf(video));video.play().catch(()=>display(0));};
        if(video.readyState>=2)play();else video.addEventListener('loadeddata',play,{once:true});
      }else if(layers.length>1){
        display(1);
        timer=setInterval(()=>display((index+1)%layers.length),interval);
      }
    }
    function stop(){
      hovering=false;
      if(timer!==null){clearInterval(timer);timer=null;}
      if(video){video.pause();video.currentTime=0;}
      display(0);
    }
    ticket.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')start()});
    ticket.addEventListener('pointerleave',stop);
    ticket.addEventListener('focusin',start);
    ticket.addEventListener('focusout',e=>{if(!ticket.contains(e.relatedTarget))stop()});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
  });
})();</script></body></html>
